<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Search Hotels | GoTravel.com</title>
    <link href="css/styles.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
    <style>
        .search-hero {
            background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.6)), url('assets/hero_bg_1777425788855.png');
            background-size: cover;
            background-position: center;
            padding: 100px 0;
            color: white;
            text-align: center;
        }
        .search-hero h1 { font-size: 48px; margin-bottom: 10px; }
        .search-hero p { font-size: 20px; max-width: 600px; margin: 0 auto; }
        
        .search-controls {
            background: var(--white);
            padding: 20px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-md);
            margin-top: -40px;
            position: relative;
            z-index: 10;
            display: flex;
            gap: 15px;
            align-items: center;
            border: 1px solid var(--border);
        }
        
        .search-controls input, .search-controls select {
            padding: 12px 20px;
            border: 1px solid var(--border);
            border-radius: 50px;
            font-size: 16px;
            font-family: inherit;
            outline: none;
            transition: var(--transition);
        }
        
        .search-controls input:focus, .search-controls select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }
        
        .search-controls input {
            flex-grow: 1;
        }
        
        .search-controls select {
            min-width: 200px;
            cursor: pointer;
            background-color: var(--white);
        }

        .properties-list { margin-top: 40px; }
        .property-item {
            display: flex;
            gap: 20px;
            border: 1px solid var(--border);
            border-radius: var(--border-radius);
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
            background: var(--white);
        }
        .property-item:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }
        .property-img { width: 200px; height: 150px; object-fit: cover; border-radius: 8px; }
        .property-details { flex: 1; }
        .property-price-container {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: flex-end;
            min-width: 150px;
        }
        .property-price { font-size: 24px; font-weight: 700; color: var(--primary); text-align: right; }
        
        .no-results {
            text-align: center;
            padding: 50px 0;
            color: var(--text-light);
            font-size: 18px;
        }
        
        @media(max-width: 768px) {
            .search-controls { flex-direction: column; }
            .search-controls input, .search-controls select { width: 100%; }
            .property-item { flex-direction: column; }
            .property-img { width: 100%; height: 200px; }
            .property-price-container { align-items: flex-start; margin-top: 15px; }
        }
    </style>
</head>
<body>

<header class="header">
    <div class="top-nav container">
        <div class="logo"><a href="index.html"><img src="assets/logo.png" alt="GoTravel.com" style="height: 40px; display: block; background: rgba(255,255,255,0.9); padding: 4px 8px; border-radius: 6px;"></a></div>
        <nav class="main-nav">
            <a href="index.html" class="nav-link">Home</a>
            <a href="search.html" class="nav-link">Search</a>
            <a href="destinations.html" class="nav-link">Destinations</a>
            <a href="packages.html" class="nav-link">Packages</a>
            <a href="experiences.html" class="nav-link">Experiences</a>
            <a href="forum.html" class="nav-link">Forum</a>
        </nav>
        <div class="nav-actions" id="nav-actions-container"></div>
    </div>
</header>

<section class="search-hero">
    <div class="container">
        <h1>Find Your Perfect Stay</h1>
        <p>Search across our top-rated hotels, resorts, and apartments worldwide.</p>
    </div>
</section>

<main class="main-content container">
    <div class="search-controls">
        <input type="text" id="search-input" placeholder="Search by hotel name or location...">
        <select id="sort-select">
            <option value="highest_rated">Highest Rated First</option>
            <option value="lowest_rated">Lowest Rated First</option>
            <option value="price_low_high">Price: Low to High</option>
            <option value="price_high_low">Price: High to Low</option>
        </select>
    </div>

    <section class="properties-list">
        <div id="results-count" style="margin-bottom: 20px; font-weight: 500; color: var(--text-light);">Loading...</div>
        <div id="search-results">
            <!-- Results injected here -->
        </div>
    </section>
</main>

<footer class="footer" style="margin-top: 60px;">
    <div class="footer-bottom text-center">
        <p>Copyright © 1996–2026 GoTravel.com. All rights reserved.</p>
    </div>
</footer>

<script src="js/auth.js"></script>
<script src="js/chatbot.js"></script>
<script src="js/script.js"></script>
<script src="js/hotel-data.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", () => {
        const searchInput = document.getElementById('search-input');
        const sortSelect = document.getElementById('sort-select');
        const resultsContainer = document.getElementById('search-results');
        const resultsCount = document.getElementById('results-count');

        // Pre-process hotel data into an array with calculated minPrice
        let hotels = Object.keys(hotelData).map(key => {
            const h = hotelData[key];
            const minPrice = h.rooms && h.rooms.length > 0 ? Math.min(...h.rooms.map(r => r.price)) : 0;
            return { id: key, ...h, minPrice };
        });

        function renderStars(score, count) {
            let starsHtml = '';
            for(let i=1; i<=5; i++) {
                if(score >= i - 0.2) {
                    starsHtml += '<i class="fas fa-star" style="color: #FFD700;"></i>';
                } else if(score >= i - 0.7) {
                    starsHtml += '<i class="fas fa-star-half-alt" style="color: #FFD700;"></i>';
                } else {
                    starsHtml += '<i class="far fa-star" style="color: #FFD700;"></i>';
                }
            }
            return `
                <div style="display: flex; align-items: center; gap: 8px; margin-top: 10px;">
                    <div style="background: var(--primary); color: white; padding: 2px 8px; border-radius: 4px; font-size: 14px; font-weight: 600;">${score.toFixed(1)}</div>
                    <div style="font-size: 14px;">${starsHtml} <span style="color: var(--text-light); margin-left: 4px;">(${count})</span></div>
                </div>
            `;
        }

        function renderResults() {
            const query = searchInput.value.toLowerCase().trim();
            const sortMode = sortSelect.value;

            // Filter
            let filtered = hotels.filter(h => 
                h.name.toLowerCase().includes(query) || 
                h.location.toLowerCase().includes(query)
            );

            // Sort
            filtered.sort((a, b) => {
                // Get dynamic rating if it exists in localStorage (similar to other pages)
                const lsKeyA = 'rating_' + a.id;
                const lsKeyB = 'rating_' + b.id;
                
                let scoreA = a.ratingScore;
                let scoreB = b.ratingScore;

                if (sortMode === 'highest_rated') return scoreB - scoreA;
                if (sortMode === 'lowest_rated') return scoreA - scoreB;
                if (sortMode === 'price_low_high') return a.minPrice - b.minPrice;
                if (sortMode === 'price_high_low') return b.minPrice - a.minPrice;
                return 0;
            });

            // Update UI
            resultsCount.textContent = `Showing ${filtered.length} property${filtered.length !== 1 ? 'ies' : ''}`;

            if (filtered.length === 0) {
                resultsContainer.innerHTML = `<div class="no-results"><i class="fas fa-search" style="font-size: 40px; margin-bottom: 15px; opacity: 0.5;"></i><br>No properties found matching your search.</div>`;
                return;
            }

            let html = '';
            filtered.forEach(h => {
                html += `
                <div class="property-item">
                    <img alt="${h.name}" class="property-img" src="${h.image}"/>
                    <div class="property-details">
                        <h3>${h.name}</h3>
                        <p style="color: var(--text-light); margin-bottom: 10px;"><i class="fas fa-map-marker-alt" style="margin-right: 5px;"></i>${h.location}</p>
                        <p>${h.description}</p>
                        ${renderStars(h.ratingScore, h.ratingCount)}
                    </div>
                    <div class="property-price-container">
                        <div style="text-align: right;">
                            <p style="font-size: 14px; color: var(--text-light); font-weight: normal; margin-bottom: 5px;">Price from</p>
                            <div class="property-price">$${h.minPrice} <span>/ night</span></div>
                        </div>
                        <a class="primary-btn" href="hotel-details.html?hotelId=${encodeURIComponent(h.id)}" style="display: block; width: 100%; margin-top: 15px; text-align: center; text-decoration: none;">View Rooms</a>
                    </div>
                </div>
                `;
            });

            resultsContainer.innerHTML = html;
        }

        // Event listeners
        searchInput.addEventListener('input', renderResults);
        sortSelect.addEventListener('change', renderResults);

        // Initial render
        renderResults();
    });
</script>
</body>
</html>
